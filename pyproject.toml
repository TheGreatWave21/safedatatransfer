[build-system]
# Exact version: the build tool is downloaded at install time, so it is pinned like the
# runtime dependencies in constraints.txt.
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safedatatransfer"
version = "0.1.0"
description = "Encrypted USB evacuation (copy, verify, wipe) and an AirDrop-style secure file drop for Windows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["usb", "wipe", "encryption", "vault", "wifi-direct", "file-transfer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "cryptography>=44",
    "spake2>=0.9",
    "textual>=1.0",
    "winrt-runtime>=3; sys_platform == 'win32'",
    "winrt-Windows.Devices.WiFiDirect>=3; sys_platform == 'win32'",
    "winrt-Windows.Devices.Enumeration>=3; sys_platform == 'win32'",
    "winrt-Windows.Networking>=3; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/TheGreatWave21/safedatatransfer"
Issues = "https://github.com/TheGreatWave21/safedatatransfer/issues"

[project.scripts]
sdt = "safedatatransfer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
