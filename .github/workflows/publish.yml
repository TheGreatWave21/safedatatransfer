# Builds the package and uploads it to PyPI with Trusted Publishing (no tokens stored).
#  - Publishing a GitHub release        -> PyPI
#  - "Run workflow" button (Actions tab) -> TestPyPI or PyPI, as chosen
# Every action is pinned to an exact commit, so a changed tag can't run new code here.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to upload"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build wheel and sdist
        run: |
          python -I -m pip install --only-binary=:all: "build==1.2.2.post1"
          python -I -m build
      - name: Check the version matches the release tag
        if: github.event_name == 'release'
        run: |
          whl=$(ls dist/*.whl); v=$(basename "$whl" | cut -d- -f2)
          test "v$v" = "${{ github.event.release.tag_name }}" || { echo "package version v$v != tag ${{ github.event.release.tag_name }}"; exit 1; }
      - run: sha256sum dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/safedatatransfer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: github.event_name == 'release' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/safedatatransfer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
